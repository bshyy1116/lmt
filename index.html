<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2026 롯데마트 서울역점 추석 선물세트 견적 산출 장표</title>
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="롯데마트 서울역점">
    <meta name="theme-color" content="#E60012">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        html, body {
            overscroll-behavior-y: none;
            -webkit-overscroll-behavior-y: none;
        }
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background-color: #f8fafc; 
            -webkit-tap-highlight-color: transparent; 
            -webkit-text-size-adjust: 100%;
        }
        .ios-pb-fix {
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 180px) !important;
        }

        /* 2개 이상 상품 전체가 잘림 없이 인쇄/PDF 저장되도록 개선된 전용 스타일 */
        @media print {
            @page {
                size: A4 portrait;
                margin: 10mm;
            }
            html, body {
                background: white !important;
                height: auto !important;
                min-height: 100% !important;
                overflow: visible !important;
            }
            body * { 
                visibility: hidden !important; 
            }
            #print-area, #print-area * { 
                visibility: visible !important; 
            }
            #print-modal {
                position: static !important;
                display: block !important;
                background: none !important;
                padding: 0 !important;
                margin: 0 !important;
                height: auto !important;
                overflow: visible !important;
            }
            #print-modal > div {
                max-width: 100% !important;
                width: 100% !important;
                height: auto !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 0 !important;
                padding: 0 !important;
                overflow: visible !important;
            }
            #print-area { 
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                overflow: visible !important;
                display: block !important;
            }
            .print-page {
                page-break-after: always !important;
                break-after: page !important;
                min-height: 250mm !important;
                box-sizing: border-box !important;
                margin-bottom: 20px !important;
                border: 1px solid #e2e8f0 !important;
            }
            .print-page:last-child {
                page-break-after: avoid !important;
                break-after: avoid !important;
                margin-bottom: 0 !important;
            }
            .no-print { 
                display: none !important; 
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-800">

    <!-- Top App Header -->
    <header class="bg-[#E60012] text-white px-4 py-3 sticky top-0 z-30 shadow-md flex items-center justify-between no-print">
        <div class="flex items-center space-x-2">
            <div class="bg-white rounded-md px-1.5 py-0.5 text-[#E60012] font-black text-sm tracking-tighter">LOTTE</div>
            <div>
                <h1 class="font-bold text-sm tracking-tight">선물Set 견적 산출 장표</h1>
                <p class="text-[10px] text-red-100">롯데마트 서울역점 현장 정산 엔진</p>
            </div>
        </div>
        <div class="flex items-center space-x-1.5">
            <button onclick="resetApp()" title="장표 초기화 및 새로고침" class="bg-white/20 active:bg-white/40 text-white p-2 rounded-lg text-xs font-bold flex items-center justify-center shadow">
                <i class="fa-solid fa-rotate-right text-xs"></i>
            </button>
            <button onclick="addRow()" class="bg-white/20 active:bg-white/40 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center space-x-1">
                <i class="fa-solid fa-plus text-[10px]"></i>
                <span>상품추가</span>
            </button>
            <button onclick="openPrintModal()" class="bg-yellow-400 active:bg-yellow-500 text-slate-900 px-2.5 py-1.5 rounded-lg text-xs font-black flex items-center space-x-1 shadow">
                <i class="fa-solid fa-file-lines text-[10px]"></i>
                <span>견적서</span>
            </button>
        </div>
    </header>

    <!-- Pre-order Period Selector Bar -->
    <div class="bg-slate-900 text-white px-4 py-3 sticky top-[53px] z-20 shadow-md flex flex-col sm:flex-row items-center justify-between gap-2 text-xs no-print">
        <div class="flex items-center space-x-2">
            <span class="bg-yellow-400 text-slate-900 font-black px-2 py-0.5 rounded text-[11px]">사전예약 차수 선택</span>
            <span class="text-slate-300 font-medium">구매금액대별 상품권/즉시할인 자동 적용</span>
        </div>
        <select id="promo-period" onchange="renderApp()" class="bg-slate-800 border border-slate-700 text-white rounded-lg px-3 py-1.5 outline-none focus:border-red-500 font-bold text-xs">
            <option value="1">1차 사전예약 (8/6 ~ 9/4) - 최대 1,200만원</option>
            <option value="2">2차 사전예약 (9/5 ~ 9/11) - 최대 800만원</option>
            <option value="3">3차 사전예약 (9/12 ~ 9/16) - 최대 500만원</option>
        </select>
    </div>

    <!-- App Body (Card List) -->
    <main class="p-3 flex-grow space-y-3 ios-pb-fix no-print" id="app-card-list">
        <!-- Dynamic Cards -->
    </main>

    <!-- Bottom Sticky Summary Bar -->
    <footer class="bg-slate-900 text-white p-4 fixed bottom-0 left-0 right-0 z-20 shadow-2xl border-t border-slate-800 flex justify-between items-center no-print" style="padding-bottom: max(1rem, env(safe-area-inset-bottom, 1rem));">
        <div>
            <p class="text-[11px] text-slate-400">총 상품수: <b id="footer-count" class="text-white">0</b>개 | 주문수량: <b id="footer-qty" class="text-yellow-400">0</b>개 | 상품권 대상액: <b id="footer-voucher-target" class="text-yellow-400">0원</b></p>
            <p class="text-xs font-bold text-slate-300">최종 결제액 (예상 상품권: <span id="footer-voucher-amt" class="text-emerald-400 font-black">0원</span>)</p>
        </div>
        <div class="text-right">
            <span id="footer-total" class="text-xl font-black text-emerald-400">0원</span>
        </div>
    </footer>

    <!-- Official Print / Quote Modal -->
    <div id="print-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center hidden p-2">
        <div class="bg-white w-full sm:max-w-2xl rounded-t-3xl sm:rounded-2xl h-[92vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 no-print">
                <h2 class="font-bold text-base text-slate-900"><i class="fa-solid fa-file-lines text-[#E60012] mr-2"></i>견적 산출 상세 장표 미리보기</h2>
                <button onclick="closePrintModal()" class="text-slate-400 hover:text-slate-700 text-2xl leading-none">&times;</button>
            </div>
            
            <!-- 인쇄 및 PDF 저장 영역 -->
            <div class="flex-grow overflow-y-auto p-4 sm:p-6 space-y-6 bg-slate-50/50" id="print-area">
                <!-- 상품별 1장씩 동적 생성 -->
            </div>

            <div class="p-4 border-t border-slate-200 bg-slate-50 flex space-x-2 no-print">
                <button onclick="closePrintModal()" class="w-1/2 py-3 bg-slate-200 text-slate-700 rounded-xl text-xs font-bold">닫기</button>
                <button onclick="window.print()" class="w-1/2 py-3 bg-[#E60012] text-white rounded-xl text-xs font-bold shadow"><i class="fa-solid fa-print mr-1"></i>인쇄 / PDF 저장 (전체 상품 각 1장)</button>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        let rows = [
            { 
                name: 'CJ 특별한선택 V호', 
                orig: 19900, 
                qty: 251, 
                promo: '7+1', 
                mdDiscRate: 5, 
                mdCash: 0, 
                useCard: true, 
                cardDiscRate: 20, 
                cardCash: 0, 
                useLp: false, 
                lpDiscRate: 0, 
                lpCash: 0, 
                supportQty: 10, 
                isVoucherTarget: true, 
                voucherAmt: 0, 
                voucherMode: 'voucher' 
            }
        ];

        function floorTo10(amount) {
            return Math.floor(amount / 10) * 10;
        }

        function formatComma(num) {
            if (num === '' || num === null || num === undefined) return '';
            const n = parseFloat(num);
            return isNaN(n) ? '' : n.toLocaleString();
        }

        function handleCommaInput(input, index, field) {
            const rawVal = input.value.replace(/,/g, '');
            const parsed = parseFloat(rawVal) || 0;
            updateRow(index, field, parsed);
        }

        function resetApp() {
            if (confirm('모든 입력 내용을 초기화하고 장표를 새로고침하시겠습니까?')) {
                location.reload();
            }
        }

        function renderApp() {
            const container = document.getElementById('app-card-list');
            if (!container) return;
            container.innerHTML = '';

            let totalQty = 0;
            let totalFinalPaymentSum = 0;
            let totalVoucherSum = 0;
            let voucherTargetTotal = 0;

            rows.forEach((r, index) => {
                totalQty += r.qty;

                // 1. N+1 계산
                let bonusQty = 0;
                if (r.promo !== '0') {
                    const parts = r.promo.split('+');
                    const baseN = parseInt(parts[0]);
                    const freeN = parseInt(parts[1]);
                    bonusQty = Math.floor(r.qty / (baseN + freeN)) * freeN;
                }
                const billingQty = r.qty - bonusQty;
                const normalCalc = r.orig * billingQty;

                // 2. MD신가 계산 (MD신가 적용 시 1원 단위 절삭)
                let mdUnitPrice = r.orig;
                if (r.mdDiscRate > 0) {
                    mdUnitPrice = floorTo10(r.orig * (1 - r.mdDiscRate / 100));
                } else if (r.mdCash > 0) {
                    mdUnitPrice = Math.max(0, r.orig - r.mdCash);
                }

                // 3. 행사카드 할인 계산
                let cardUnitPrice = mdUnitPrice;
                if (r.useCard) {
                    if (r.cardDiscRate > 0) {
                        cardUnitPrice = mdUnitPrice * (1 - r.cardDiscRate / 100);
                    } else if (r.cardCash > 0) {
                        cardUnitPrice = Math.max(0, mdUnitPrice - r.cardCash);
                    }
                }

                // 4. L.POINT 할인 계산
                let lpUnitPrice = cardUnitPrice;
                if (r.useLp) {
                    if (r.lpDiscRate > 0) {
                        lpUnitPrice = cardUnitPrice * (1 - r.lpDiscRate / 100);
                    } else if (r.lpCash > 0) {
                        lpUnitPrice = Math.max(0, cardUnitPrice - r.lpCash);
                    }
                }

                const finalAppliedUnitPrice = (r.useCard || r.useLp) ? Math.round(lpUnitPrice) : floorTo10(lpUnitPrice);

                // 5. 기본 고객 결제액 산출 (1원 단위 절삭)
                let itemPayment = floorTo10(lpUnitPrice * billingQty);

                if (r.isVoucherTarget) {
                    voucherTargetTotal += itemPayment;
                }

                // 즉시 할인 적용 여부에 따른 개별 상품 최종 결제액 및 개당 단가 산정
                let itemNetPayment = itemPayment;
                if (r.voucherMode === 'instant' && r.voucherAmt > 0) {
                    itemNetPayment = floorTo10(Math.max(0, itemPayment - r.voucherAmt));
                }
                totalFinalPaymentSum += itemNetPayment;

                // 상품권 수령 모드일 때만 예상 상품권 합계에 반영
                if (r.voucherMode === 'voucher' && r.voucherAmt > 0) {
                    totalVoucherSum += r.voucherAmt;
                }

                const totalReceiveQty = r.qty + r.supportQty;
                const unitPricePerItem = totalReceiveQty > 0 ? Math.round(itemNetPayment / totalReceiveQty) : 0;

                container.innerHTML += `
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3 relative mb-3">
                    <div class="flex justify-between items-center space-x-2">
                        <input type="text" value="${r.name}" onchange="updateRow(${index}, 'name', this.value)" placeholder="상품명을 입력하세요" class="font-bold text-slate-900 text-sm w-full border-b border-slate-200 focus:border-red-500 outline-none pb-1">
                        <label class="flex items-center space-x-1 whitespace-nowrap bg-amber-50 border border-amber-200 px-2 py-1 rounded-lg text-[11px] font-bold text-amber-800 cursor-pointer">
                            <input type="checkbox" ${r.isVoucherTarget ? 'checked' : ''} onchange="updateRow(${index}, 'isVoucherTarget', this.checked)" class="accent-red-600 rounded">
                            <span>상품권증정대상</span>
                        </label>
                        <button onclick="deleteRow(${index})" class="text-slate-300 hover:text-red-500 p-1"><i class="fa-solid fa-trash-can text-xs"></i></button>
                    </div>

                    <!-- 기본 입력: 정상가 / 실계산수량 / N+1 -->
                    <div class="grid grid-cols-3 gap-2 text-xs bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                        <div>
                            <span class="text-slate-400 block text-[10px]">정상매가</span>
                            <div class="relative">
                                <input type="text" inputmode="numeric" value="${formatComma(r.orig)}" oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/\\B(?=(\\d{3})+(?!\\d))/g, ',')" onchange="handleCommaInput(this, ${index}, 'orig')" class="w-full bg-white border rounded pl-1.5 pr-6 py-1 text-right font-medium">
                                <span class="absolute right-1.5 top-1 text-[10px] text-slate-400 pointer-events-none">원</span>
                            </div>
                        </div>
                        <div>
                            <span class="text-slate-400 block text-[10px]">실계산수량(주문)</span>
                            <div class="relative">
                                <input type="text" inputmode="numeric" value="${formatComma(r.qty)}" oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/\\B(?=(\\d{3})+(?!\\d))/g, ',')" onchange="handleCommaInput(this, ${index}, 'qty')" class="w-full bg-white border rounded pl-1.5 pr-6 py-1 text-center font-bold">
                                <span class="absolute right-1.5 top-1 text-[10px] text-slate-400 pointer-events-none">개</span>
                            </div>
                        </div>
                        <div>
                            <span class="text-slate-400 block text-[10px]">N+1 프로모션</span>
                            <select onchange="updateRow(${index}, 'promo', this.value)" class="bg-white border rounded p-1 text-[11px] font-bold text-amber-700 w-full">
                                <option value="0" ${r.promo==='0'?'selected':''}>덤 없음</option>
                                <option value="1+1" ${r.promo==='1+1'?'selected':''}>1+1</option>
                                <option value="2+1" ${r.promo==='2+1'?'selected':''}>2+1</option>
                                <option value="3+1" ${r.promo==='3+1'?'selected':''}>3+1</option>
                                <option value="4+1" ${r.promo==='4+1'?'selected':''}>4+1</option>
                                <option value="5+1" ${r.promo==='5+1'?'selected':''}>5+1</option>
                                <option value="6+1" ${r.promo==='6+1'?'selected':''}>6+1</option>
                                <option value="7+1" ${r.promo==='7+1'?'selected':''}>7+1</option>
                                <option value="8+1" ${r.promo==='8+1'?'selected':''}>8+1</option>
                                <option value="9+1" ${r.promo==='9+1'?'selected':''}>9+1</option>
                                <option value="10+1" ${r.promo==='10+1'?'selected':''}>10+1</option>
                            </select>
                        </div>
                    </div>

                    <!-- N+1 결과 및 MD신가 -->
                    <div class="grid grid-cols-2 gap-2 text-xs bg-purple-50/50 p-2.5 rounded-xl border border-purple-100">
                        <div>
                            <span class="text-purple-700 block text-[10px] font-bold">덤수량: <b class="text-red-600">${formatComma(bonusQty)}개</b> | 실혜택수량: <b>${formatComma(billingQty)}개</b></span>
                            <span class="text-slate-500 text-[10px]">정상계산: ${normalCalc.toLocaleString()}원</span>
                        </div>
                        <div class="space-y-1">
                            <span class="text-slate-400 block text-[10px]">MD신가 (할인율 % / 금액 원)</span>
                            <div class="flex space-x-1">
                                <div class="relative w-1/2">
                                    <input type="number" step="0.5" value="${r.mdDiscRate}" onchange="updateRow(${index}, 'mdDiscRate', this.value)" placeholder="0" class="w-full bg-white border rounded pl-1.5 pr-5 py-1 text-right font-bold text-purple-700">
                                    <span class="absolute right-1.5 top-1 text-[10px] text-slate-500 font-bold pointer-events-none">%</span>
                                </div>
                                <div class="relative w-1/2">
                                    <input type="text" inputmode="numeric" value="${formatComma(r.mdCash)}" oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/\\B(?=(\\d{3})+(?!\\d))/g, ',')" onchange="handleCommaInput(this, ${index}, 'mdCash')" placeholder="0" class="w-full bg-white border rounded pl-1.5 pr-7 py-1 text-right font-medium">
                                    <span class="absolute right-1.5 top-1 text-[10px] text-slate-500 font-bold pointer-events-none">원</span>
                                </div>
                            </div>
                            <div class="text-right text-[11px] font-bold text-purple-900">MD단가: ${mdUnitPrice.toLocaleString()}원</div>
                        </div>
                    </div>

                    <!-- 행사카드 및 L.POINT 분리 할인 -->
                    <div class="space-y-2 text-xs bg-blue-50/50 p-2.5 rounded-xl border border-blue-100">
                        <div class="flex items-center justify-between">
                            <label class="flex items-center space-x-2 font-medium text-slate-700 cursor-pointer">
                                <input type="checkbox" ${r.useCard ? 'checked' : ''} onchange="updateRow(${index}, 'useCard', this.checked)" class="w-4 h-4 accent-red-600 rounded">
                                <span class="font-bold text-blue-900">행사카드 할인</span>
                            </label>
                            <div class="flex space-x-1">
                                <div class="relative w-16">
                                    <input type="number" step="0.5" value="${r.cardDiscRate}" onchange="updateRow(${index}, 'cardDiscRate', this.value)" placeholder="0" class="w-full bg-white border rounded pl-1 pr-5 py-0.5 text-right font-bold text-blue-600">
                                    <span class="absolute right-1.5 top-0.5 text-[10px] text-slate-500 font-bold pointer-events-none">%</span>
                                </div>
                                <div class="relative w-24">
                                    <input type="text" inputmode="numeric" value="${formatComma(r.cardCash)}" oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/\\B(?=(\\d{3})+(?!\\d))/g, ',')" onchange="handleCommaInput(this, ${index}, 'cardCash')" placeholder="0" class="w-full bg-white border rounded pl-1 pr-7 py-0.5 text-right font-medium">
                                    <span class="absolute right-1.5 top-0.5 text-[10px] text-slate-500 font-bold pointer-events-none">원</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center justify-between pt-1 border-t border-blue-100">
                            <label class="flex items-center space-x-2 font-medium text-slate-700 cursor-pointer">
                                <input type="checkbox" ${r.useLp ? 'checked' : ''} onchange="updateRow(${index}, 'useLp', this.checked)" class="w-4 h-4 accent-red-600 rounded">
                                <span class="font-bold text-indigo-900">L.POINT 할인</span>
                            </label>
                            <div class="flex space-x-1">
                                <div class="relative w-16">
                                    <input type="number" step="0.5" value="${r.lpDiscRate}" onchange="updateRow(${index}, 'lpDiscRate', this.value)" placeholder="0" class="w-full bg-white border rounded pl-1 pr-5 py-0.5 text-right font-bold text-indigo-600">
                                    <span class="absolute right-1.5 top-0.5 text-[10px] text-slate-500 font-bold pointer-events-none">%</span>
                                </div>
                                <div class="relative w-24">
                                    <input type="text" inputmode="numeric" value="${formatComma(r.lpCash)}" oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/\\B(?=(\\d{3})+(?!\\d))/g, ',')" onchange="handleCommaInput(this, ${index}, 'lpCash')" placeholder="0" class="w-full bg-white border rounded pl-1 pr-7 py-0.5 text-right font-medium">
                                    <span class="absolute right-1.5 top-0.5 text-[10px] text-slate-500 font-bold pointer-events-none">원</span>
                                </div>
                            </div>
                        </div>
                        <div class="text-right text-[11px] font-bold text-blue-900 pt-1">최종적용단가: ${finalAppliedUnitPrice.toLocaleString()}원</div>
                    </div>

                    <!-- 지원물량 및 실수령 수량 -->
                    <div class="grid grid-cols-2 gap-2 text-xs bg-slate-50 p-2.5 rounded-xl border border-slate-100 items-center">
                        <div>
                            <span class="text-slate-400 block text-[10px]">지원물량 수량 (개)</span>
                            <div class="relative">
                                <input type="text" inputmode="numeric" value="${formatComma(r.supportQty)}" oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/\\B(?=(\\d{3})+(?!\\d))/g, ',')" onchange="handleCommaInput(this, ${index}, 'supportQty')" placeholder="0" class="w-full bg-white border rounded pl-1.5 pr-6 py-1 text-center font-bold">
                                <span class="absolute right-1.5 top-1 text-[10px] text-slate-400 pointer-events-none">개</span>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-slate-400 block text-[10px]">실수령 수량 (주문+지원)</span>
                            <span class="font-black text-slate-800 text-sm">${formatComma(totalReceiveQty)}개</span>
                        </div>
                    </div>

                    <!-- 최종 결제액 및 상품권/즉시할인 설정 영역 -->
                    <div class="bg-red-50/70 border border-red-100 p-3 rounded-xl space-y-2.5 text-xs">
                        <div class="flex justify-between items-center">
                            <div>
                                <span class="text-slate-600 font-medium block">최종 고객 결제액</span>
                                <span class="text-[10px] text-slate-400">개당 단가(실수령기준): <b>${unitPricePerItem.toLocaleString()}원</b></span>
                            </div>
                            <span class="font-black text-red-600 text-base">${itemNetPayment.toLocaleString()}원</span>
                        </div>

                        <div class="pt-2 border-t border-red-200/60 space-y-2">
                            <div class="flex items-center justify-between">
                                <span class="font-bold text-slate-700">상품권 증정 금액 입력</span>
                                <div class="relative w-36">
                                    <input type="text" inputmode="numeric" value="${formatComma(r.voucherAmt)}" oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/\\B(?=(\\d{3})+(?!\\d))/g, ',')" onchange="handleCommaInput(this, ${index}, 'voucherAmt')" placeholder="0" class="w-full bg-white border border-red-200 rounded pl-1.5 pr-7 py-1 text-right font-bold text-amber-700">
                                    <span class="absolute right-1.5 top-1 text-[10px] text-slate-500 font-bold pointer-events-none">원</span>
                                </div>
                            </div>
                            <div class="flex items-center justify-between bg-white/80 p-2 rounded-lg border border-red-100">
                                <span class="font-medium text-slate-600">혜택 적용 방식</span>
                                <div class="flex space-x-3 text-xs font-bold">
                                    <label class="flex items-center space-x-1 cursor-pointer">
                                        <input type="radio" name="voucherMode_${index}" ${r.voucherMode === 'voucher' ? 'checked' : ''} onchange="updateRow(${index}, 'voucherMode', 'voucher')" class="accent-red-600">
                                        <span>상품권 수령</span>
                                    </label>
                                    <label class="flex items-center space-x-1 cursor-pointer">
                                        <input type="radio" name="voucherMode_${index}" ${r.voucherMode === 'instant' ? 'checked' : ''} onchange="updateRow(${index}, 'voucherMode', 'instant')" class="accent-red-600">
                                        <span class="text-red-700">즉시 할인 적용</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            });

            const countElem = document.getElementById('footer-count');
            const qtyElem = document.getElementById('footer-qty');
            const voucherTargetElem = document.getElementById('footer-voucher-target');
            const voucherAmtElem = document.getElementById('footer-voucher-amt');
            const totalElem = document.getElementById('footer-total');

            if (countElem) countElem.innerText = rows.length;
            if (qtyElem) qtyElem.innerText = formatComma(totalQty);
            if (voucherTargetElem) voucherTargetElem.innerText = voucherTargetTotal.toLocaleString() + '원';
            if (voucherAmtElem) voucherAmtElem.innerText = totalVoucherSum.toLocaleString() + '원';
            if (totalElem) totalElem.innerText = totalFinalPaymentSum.toLocaleString() + '원';
        }

        function updateRow(index, field, value) {
            if (['orig', 'qty', 'mdDiscRate', 'mdCash', 'cardDiscRate', 'cardCash', 'lpDiscRate', 'lpCash', 'supportQty', 'voucherAmt'].includes(field)) {
                rows[index][field] = parseFloat(value) || 0;
            } else if (['useCard', 'useLp', 'isVoucherTarget', 'voucherMode'].includes(field)) {
                rows[index][field] = value;
            } else {
                rows[index][field] = value;
            }
            renderApp();
        }

        function addRow() {
            rows.push({ 
                name: '', 
                orig: 0, 
                qty: 1, 
                promo: '0', 
                mdDiscRate: 0, 
                mdCash: 0, 
                useCard: false, 
                cardDiscRate: 0, 
                cardCash: 0, 
                useLp: false, 
                lpDiscRate: 0, 
                lpCash: 0, 
                supportQty: 0, 
                isVoucherTarget: true, 
                voucherAmt: 0, 
                voucherMode: 'voucher' 
            });
            renderApp();
        }

        function deleteRow(index) {
            rows.splice(index, 1);
            renderApp();
        }

        // 2개 이상의 모든 상품이 각각 A4 1장씩 순서대로 전부 출력되도록 렌더링
        function openPrintModal() {
            const printArea = document.getElementById('print-area');
            if (!printArea) return;
            printArea.innerHTML = '';

            const promoText = document.getElementById('promo-period').options[document.getElementById('promo-period').selectedIndex].text;

            rows.forEach((r, i) => {
                let bonusQty = 0;
                if (r.promo !== '0') {
                    const parts = r.promo.split('+');
                    const baseN = parseInt(parts[0]);
                    const freeN = parseInt(parts[1]);
                    bonusQty = Math.floor(r.qty / (baseN + freeN)) * freeN;
                }
                const billingQty = r.qty - bonusQty;
                const origAmt = r.orig * billingQty;

                let mdUnitPrice = r.orig;
                if (r.mdDiscRate > 0) mdUnitPrice = floorTo10(r.orig * (1 - r.mdDiscRate / 100));
                else if (r.mdCash > 0) mdUnitPrice = Math.max(0, r.orig - r.mdCash);

                let cardUnitPrice = mdUnitPrice;
                if (r.useCard) {
                    if (r.cardDiscRate > 0) cardUnitPrice = mdUnitPrice * (1 - r.cardDiscRate / 100);
                    else if (r.cardCash > 0) cardUnitPrice = Math.max(0, mdUnitPrice - r.cardCash);
                }

                let lpUnitPrice = cardUnitPrice;
                if (r.useLp) {
                    if (r.lpDiscRate > 0) lpUnitPrice = cardUnitPrice * (1 - r.lpDiscRate / 100);
                    else if (r.lpCash > 0) lpUnitPrice = Math.max(0, cardUnitPrice - r.lpCash);
                }

                const finalAppliedUnitPrice = (r.useCard || r.useLp) ? Math.round(lpUnitPrice) : floorTo10(lpUnitPrice);
                const finalAmt = floorTo10(lpUnitPrice * billingQty);
                const totalReceiveQty = r.qty + r.supportQty;

                let itemNet = finalAmt;
                if (r.voucherMode === 'instant' && r.voucherAmt > 0) {
                    itemNet = floorTo10(Math.max(0, finalAmt - r.voucherAmt));
                }

                const unitPricePerItem = totalReceiveQty > 0 ? Math.round(itemNet / totalReceiveQty) : 0;
                const totalDisc = (r.orig * r.qty) - itemNet;

                // 개별 상품별 A4 1장 전용 카드 생성
                printArea.innerHTML += `
                <div class="print-page bg-white p-6 rounded-2xl border border-slate-200 shadow-sm text-slate-800 flex flex-col justify-between">
                    <div>
                        <!-- 상단 헤더 -->
                        <div class="flex justify-between items-start border-b-2 border-[#E60012] pb-3">
                            <div>
                                <span class="bg-[#E60012] text-white font-black px-2 py-0.5 rounded text-xs tracking-tight">LOTTE MART</span>
                                <h2 class="text-xl font-black text-slate-900 mt-1">2026 추석 선물세트 개별 견적서</h2>
                                <p class="text-xs text-slate-500">롯데마트 서울역점 현장 정산 견적 장표 (상품 ${i+1}/${rows.length})</p>
                            </div>
                            <div class="text-right text-xs">
                                <span class="bg-slate-100 text-slate-700 px-2 py-1 rounded font-bold border border-slate-200">${promoText.split(' - ')[0]}</span>
                                <p class="text-[11px] text-slate-400 mt-1">출력일자: ${new Date().toLocaleDateString('ko-KR')}</p>
                            </div>
                        </div>

                        <!-- 상품 기본 정보 -->
                        <div class="bg-slate-50 rounded-xl p-3.5 mt-3 border border-slate-200">
                            <span class="text-[11px] font-bold text-[#E60012] block">견적 대상 상품 (${i+1}번 품목)</span>
                            <div class="flex justify-between items-center mt-0.5">
                                <h3 class="text-lg font-black text-slate-900">${r.name || '상품명 미입력'}</h3>
                                <span class="text-xs font-bold text-slate-600">정상매가: <b>${formatComma(r.orig)}원</b></span>
                            </div>
                        </div>

                        <!-- 상세 산출 내역 표 -->
                        <div class="mt-4 space-y-2">
                            <h4 class="font-bold text-xs text-slate-700 border-l-4 border-red-600 pl-2">세부 프로모션 및 단가 산출 장표</h4>
                            <table class="w-full text-xs text-left border-collapse border border-slate-200">
                                <tbody>
                                    <tr class="border-b border-slate-200 bg-slate-50/50">
                                        <th class="p-2 border-r border-slate-200 text-slate-600 w-1/3">주문 수량 / 프로모션</th>
                                        <td class="p-2 font-medium">주문: <b>${formatComma(r.qty)}개</b> (${r.promo !== '0' ? r.promo + ' 적용' : '덤 없음'})</td>
                                    </tr>
                                    <tr class="border-b border-slate-200">
                                        <th class="p-2 border-r border-slate-200 text-slate-600">덤 증정 / 실계산 수량</th>
                                        <td class="p-2 font-medium">덤: <b class="text-red-600">${formatComma(bonusQty)}개</b> | 실계산: <b>${formatComma(billingQty)}개</b></td>
                                    </tr>
                                    <tr class="border-b border-slate-200 bg-slate-50/50">
                                        <th class="p-2 border-r border-slate-200 text-slate-600">지원 물량 / 총 실수령 수량</th>
                                        <td class="p-2 font-bold text-indigo-900">지원: ${formatComma(r.supportQty)}개 ➔ 총 실수령: ${formatComma(totalReceiveQty)}개</td>
                                    </tr>
                                    <tr class="border-b border-slate-200">
                                        <th class="p-2 border-r border-slate-200 text-slate-600">MD 신가 적용 단가</th>
                                        <td class="p-2 font-medium">${r.mdDiscRate > 0 ? r.mdDiscRate + '% 할인' : (r.mdCash > 0 ? formatComma(r.mdCash) + '원 할인' : '미적용')} ➔ <b class="text-purple-900">${formatComma(mdUnitPrice)}원</b></td>
                                    </tr>
                                    <tr class="border-b border-slate-200 bg-slate-50/50">
                                        <th class="p-2 border-r border-slate-200 text-slate-600">행사카드 / L.POINT 할인</th>
                                        <td class="p-2 font-medium">
                                            카드: ${r.useCard ? (r.cardDiscRate > 0 ? r.cardDiscRate + '%' : formatComma(r.cardCash) + '원') : '미적용'} | 
                                            L.POINT: ${r.useLp ? (r.lpDiscRate > 0 ? r.lpDiscRate + '%' : formatComma(r.lpCash) + '원') : '미적용'}
                                        </td>
                                    </tr>
                                    <tr class="border-b border-slate-200">
                                        <th class="p-2 border-r border-slate-200 text-slate-600 font-bold bg-red-50/30">최종 적용 기준 단가</th>
                                        <td class="p-2 font-black text-slate-900 bg-red-50/30">${formatComma(finalAppliedUnitPrice)}원</td>
                                    </tr>
                                    <tr class="border-b border-slate-200 bg-slate-50/50">
                                        <th class="p-2 border-r border-slate-200 text-slate-600">상품권 혜택 구분</th>
                                        <td class="p-2 font-bold">
                                            ${r.voucherAmt > 0 
                                                ? (r.voucherMode === 'instant' ? '<span class="text-red-700">상품권 즉시할인 (' + formatComma(r.voucherAmt) + '원 차감)</span>' : '<span class="text-amber-700">상품권 지류 수령 (' + formatComma(r.voucherAmt) + '원)</span>') 
                                                : '해당 없음'}
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- 정산 요약 박스 -->
                        <div class="bg-slate-900 text-white rounded-xl p-4 space-y-2 mt-4">
                            <div class="flex justify-between text-xs text-slate-300">
                                <span>정상 총액 (정상가 × 주문수량):</span>
                                <span>${formatComma(r.orig * r.qty)}원</span>
                            </div>
                            <div class="flex justify-between text-xs text-red-400">
                                <span>총 에누리 및 할인 차감액:</span>
                                <span>-${formatComma(totalDisc)}원</span>
                            </div>
                            ${r.voucherMode === 'voucher' && r.voucherAmt > 0 ? `
                            <div class="flex justify-between text-xs text-yellow-400">
                                <span>증정 예상 상품권:</span>
                                <span>${formatComma(r.voucherAmt)}원</span>
                            </div>
                            ` : ''}
                            <div class="border-t border-slate-700 pt-2 flex justify-between items-center">
                                <div>
                                    <span class="text-sm font-bold text-white block">최종 고객 결제 총액</span>
                                    <span class="text-[11px] text-emerald-400 font-medium">개당 실부담단가(실수령 기준): <b>${formatComma(unitPricePerItem)}원</b></span>
                                </div>
                                <span class="text-xl font-black text-emerald-400">${formatComma(itemNet)}원</span>
                            </div>
                        </div>
                    </div>

                    <!-- 하단 안내 푸터 (수정 반영) -->
                    <div class="border-t border-slate-200 pt-3 mt-4 flex justify-between items-center text-[10px] text-slate-400">
                        <span>* 본 견적서는 롯데마트 서울역점 비공식 상담용 견적서입니다.</span>
                        <span class="font-bold text-slate-600">롯데마트 서울역점</span>
                    </div>
                </div>
                `;
            });

            const printModal = document.getElementById('print-modal');
            if (printModal) printModal.classList.remove('hidden');
        }

        function closePrintModal() {
            const printModal = document.getElementById('print-modal');
            if (printModal) printModal.classList.add('hidden');
        }

        window.onload = () => renderApp();
    </script>
</body>
</html>
